<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0e11;--surface:#141519;--border:rgba(255,255,255,.08);--field:rgba(255,255,255,.15);--link:rgba(255,255,255,.14);
 --text:#e8e6de;--muted:rgba(232,230,222,.5);--gold:#c8a96e;--green:#6abd8a;--branch:rgba(200,169,110,.38);--leaf:rgba(106,189,138,.28);color-scheme:dark;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f4f0e6;--surface:#ebe5d7;--border:rgba(20,30,40,.14);--field:rgba(20,30,40,.22);--link:rgba(20,30,40,.22);
 --text:#1c2230;--muted:rgba(28,34,48,.62);--gold:#94701c;--green:#2f7a4c;--branch:rgba(148,112,28,.5);--leaf:rgba(47,122,76,.4)}}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f0e6;--surface:#ebe5d7;--border:rgba(20,30,40,.14);--field:rgba(20,30,40,.22);--link:rgba(20,30,40,.22);
 --text:#1c2230;--muted:rgba(28,34,48,.62);--gold:#94701c;--green:#2f7a4c;--branch:rgba(148,112,28,.5);--leaf:rgba(47,122,76,.4)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-weight:300;min-height:100%;display:flex;flex-direction:column}
header{padding:2.2rem 4.5rem 1.2rem 2rem;border-bottom:1px solid var(--border)}
header h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.7rem,3.2vw,2.5rem);letter-spacing:.04em}
header p{font-size:.75rem;color:var(--muted);margin-top:.35rem;font-family:'IBM Plex Mono',monospace;letter-spacing:.07em}
header nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
header nav a{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.06em;color:var(--muted);text-decoration:none;border:1px solid var(--field);border-radius:20px;padding:.3rem .8rem}
header nav a:hover{color:var(--gold);border-color:var(--gold)}
header nav a.locked{border-style:dashed}
#controls{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
.ctl{display:flex;flex-direction:column;gap:.3rem}
.ctl label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ctl select,.ctl input{background:var(--bg);color:var(--text);border:1px solid var(--field);border-radius:6px;padding:.45rem .6rem;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;min-width:150px}
.ctl select:focus,.ctl input:focus{outline:none;border-color:var(--gold)}
.ctl-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.mini-btn{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.07em;color:var(--muted);background:none;border:1px solid var(--field);border-radius:6px;padding:.45rem .8rem;cursor:pointer}
.mini-btn:hover,.mini-btn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
#count-line{font-family:'IBM Plex Mono',monospace;font-size:.64rem;color:var(--muted);letter-spacing:.06em;margin-left:auto;align-self:center}
#map-wrap{flex:1;overflow:auto;position:relative}
#map{display:block}
#status{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--muted);padding:.6rem 2rem;letter-spacing:.05em}
.node-group{cursor:pointer;outline:none}
.node-rect{fill:var(--surface);stroke:var(--border);transition:stroke .2s}
.node-group:hover .node-rect,.node-group:focus-visible .node-rect{stroke:var(--gold);stroke-width:1.5}
.node-rect.branch{stroke:var(--branch)}
.node-rect.leaf{stroke:var(--leaf)}
.node-rect.paid{stroke-dasharray:4 3}
.node-label{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:400;fill:var(--text);pointer-events:none}
.node-count{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--muted);pointer-events:none}
.node-arrow{font-size:10px;fill:var(--green);pointer-events:none}
.node-lock{font-size:10px;pointer-events:none}
.link{fill:none;stroke:var(--link);stroke-width:1}
.root-label{font-family:'Cormorant Garamond',serif;font-size:20px;fill:var(--gold)}
footer{padding:1.1rem 2rem;border-top:1px solid var(--border);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:var(--muted);text-align:center}
/* settings */
.gear{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid var(--field);background:var(--surface);color:var(--text);font-size:19px;cursor:pointer}
.gear:hover{border-color:var(--gold);color:var(--gold)}
.settings{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:14px;z-index:20;background:var(--surface);border:1px solid var(--field);border-radius:8px;padding:12px 16px;min-width:200px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.settings.open{display:block}.settings h4{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.2rem;margin-bottom:6px}
.settings label{display:flex;gap:9px;align-items:center;padding:3px 0;font-size:.9rem;cursor:pointer}.settings input{accent-color:var(--gold)}
@media (max-width:600px){header{padding-left:1.2rem}#controls{padding:1rem 1.2rem}}
</style>

const splitTags=v=>(v||'').split(';').map(s=>s.trim()).filter(Boolean);

function resolve(u){
  if(!u)return'';u=u.trim().replace(/^['",]+|['",]+$/g,'').replace(/[\u200B-\u200D\uFEFF]/g,'');
  if(/\s/.test(u)&&!/^https?:/i.test(u)&&!/\.(html|pdf|py|m4a)$/i.test(u))return'';
  if(/^https?:\/\//i.test(u))return encodeURI(decodeURI(u));
  if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(u)&&!/\.(html?|pdf|py|m4a)$/i.test(u))return'https://'+u;
  return'https://leelemacjames.github.io/'+encodeURI(u.replace(/^\/+/,''));
}
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f.trim());f=''}
  else if(c==='\n'||c==='\r'){if(f||row.length){row.push(f.trim());rows.push(row)}row=[];f='';if(c==='\r'&&text[i+1]==='\n')i++}else f+=c}
  if(f||row.length){row.push(f.trim());rows.push(row)}return rows}

  rows.forEach(a=>{const url=resolve(a['App URL']);if(!url||!a['App Name']||seen.has(url))return;seen.add(url);a._url=url;a._paid=isPaid(a);out.push(a)});return out}

function useRows(rows,headers,note){

async function loadData(){

  try{
    const res=await fetch(FETCH_URL,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
    const rows=parseCSV(await res.text());if(rows.length<2)throw new Error('No data rows');
    const headers=rows[0].map(h=>h.replace(/^"|"$/g,'').trim());
    const apps=rows.slice(1).filter(v=>!(v.length<=1&&v[0]==='')).map(v=>Object.fromEntries(headers.map((h,i)=>[h,(v[i]||'').replace(/^"|"$/g,'').trim()])));
    useRows(apps,headers,`Live from the catalogue sheet · ${new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}`);

}

function buildControls(){
  ['l1','l2','l3'].forEach((id,idx)=>{
    const sel=document.getElementById(id),prev=sel.value;sel.innerHTML='';
    if(idx>0){const n=document.createElement('option');n.value='';n.textContent='— none —';sel.appendChild(n)}
    BRANCH_FACETS.filter(facetAvailable).forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;sel.appendChild(o)});
    const want=prev&&[...sel.options].some(o=>o.value===prev)?prev:DEFAULTS[idx];
    sel.value=facetAvailable(want)?want:(idx===0?(sel.options[0]||{}).value:'');
    if(!controlsBound)sel.addEventListener('change',rebuild);
  });
  if(!controlsBound){

function groupBy(apps,facet){const map={};
  apps.forEach(a=>{const tags=facet==='Level'?[LEVEL_LABELS[a.Level]||a.Level||'—']:(splitTags(a[facet]).length?splitTags(a[facet]):['—']);
    tags.forEach(t=>(map[t]=map[t]||[]).push(a))});
  return Object.entries(map).sort((x,y)=>y[1].length-x[1].length)}
function buildTree(){
  const facets=['l1','l2','l3'].map(id=>document.getElementById(id).value).filter(Boolean);
  const q=$('#search').value.trim().toLowerCase();
  const apps=pool().filter(a=>!q||[appName(a),a['App Name'],a.Description,a.Subject,a.Domain,a.Theme,a.Format,a.Series,a.Hub,a.Type].filter(Boolean).join(' ').toLowerCase().includes(q));
  function build(name,list,depth){
    const node={name,count:list.length,depth,children:[],open:depth<1};
    if(depth>=facets.length){node.children=list.map(a=>({name:appName(a),url:a._url,paid:a._paid,desc:a.Description||'',leaf:true,depth:depth+1,count:0,children:[],open:false}));return node}
    groupBy(list,facets[depth]).forEach(([g,sub])=>node.children.push(build(g,sub,depth+1)));return node}
  root=build('leelemacjames.github.io',apps,0);root.open=true;if(q)expandAllNodes(root);
  $('#count-line').textContent=`${apps.length} ${hubOnly?'hub ':''}apps · ${facets.join(' → ')||'flat'}`;
}
function expandAllNodes(n){if(!n.leaf){n.open=true;n.children.forEach(expandAllNodes)}}

  return{nodes:placed,height:Math.max(y+PAD,300)}}
const nodeWidth=n=>n.depth===0?Math.min(222,24+n.name.length*8.6):Math.min(210,30+n.name.length*6.4+(n.count?34:14)+(n.paid?12:0));
function render(){
  const{nodes,height}=layout(),NS='http://www.w3.org/2000/svg';
  const maxDepth=Math.max(...nodes.map(n=>n.depth));
  svg.setAttribute('width',PAD*2+(maxDepth+1)*DEPTH_W);svg.setAttribute('height',height);svg.innerHTML='';
  nodes.forEach(n=>{if(!n.open||!n.children.length)return;n.children.forEach(c=>{const p=document.createElementNS(NS,'path');
    const x1=n.x+nodeWidth(n),y1=n.y+NODE_H/2,x2=c.x,y2=c.y+NODE_H/2,mx=(x1+x2)/2;
    p.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);p.setAttribute('class','link');svg.appendChild(p)})});
  nodes.forEach(n=>{
    const g=document.createElementNS(NS,'g'),w=nodeWidth(n);
    g.setAttribute('class','node-group');g.setAttribute('transform',`translate(${n.x},${n.y})`);g.setAttribute('tabindex','0');
    g.setAttribute('role',n.leaf?'link':'treeitem');if(!n.leaf)g.setAttribute('aria-expanded',n.open);
    const tt=document.createElementNS(NS,'title');tt.textContent=n.leaf?(n.name+(n.paid?' (for paid subscribers)':'')+(n.desc&&!/\.(html?|pdf)$/i.test(n.desc)?' · '+n.desc:'')):`${n.name} · ${n.count}`;g.appendChild(tt);
    const r=document.createElementNS(NS,'rect');r.setAttribute('width',w);r.setAttribute('height',NODE_H);r.setAttribute('rx',8);
    r.setAttribute('class','node-rect '+(n.leaf?'leaf':'branch')+(n.paid?' paid':''));g.appendChild(r);
    const t=document.createElementNS(NS,'text');t.setAttribute('x',10);t.setAttribute('y',NODE_H/2+4);t.setAttribute('class',n.depth===0?'root-label':'node-label');
    const maxChars=n.leaf?(n.paid?26:28):24;t.textContent=n.name.length>maxChars?n.name.slice(0,maxChars-1)+'…':n.name;g.appendChild(t);
    if(n.leaf){
      const a=document.createElementNS(NS,'text');a.setAttribute('x',w-14);a.setAttribute('y',NODE_H/2+4);
      a.setAttribute('class',n.paid?'node-lock':'node-arrow');a.textContent=n.paid?'🔒':'↗';g.appendChild(a);
      const go=()=>window.open(n.paid?SUBSCRIBE:n.url,'_blank','noopener');
      g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
    }else{
      const c=document.createElementNS(NS,'text');c.setAttribute('x',w-6);c.setAttribute('y',NODE_H/2+3.5);c.setAttribute('text-anchor','end');
      c.setAttribute('class','node-count');c.textContent=(n.open?'▾ ':'▸ ')+n.count;if(n.depth>0)g.appendChild(c);
      const tog=()=>{n.open=!n.open;render();const again=[...svg.querySelectorAll('.node-group')].find(x=>x.__n===n);if(again)again.focus()};
      g.addEventListener('click',tog);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});
    }
    g.__n=n;svg.appendChild(g)});
}
function rebuild(){buildTree();render()}
loadData();
})();
</script>
