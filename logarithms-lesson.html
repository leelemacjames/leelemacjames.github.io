{k:`00–02 min · Part 1 · A sense of scale`,
t:`Where does 100,000 sit on a line from 0 to 1,000,000,000?`,
c:`<div class="sparseaxis"><span class="axiszero">0</span><div class="heavyline"></div><span class="axisend">1,000,000,000</span><button class="positionchoice" style="left:1%" data-label="A"><span>↑</span>A</button><button class="positionchoice" style="left:10%" data-label="B"><span>↑</span>B</button><button class="positionchoice" style="left:25%" data-label="C"><span>↑</span>C</button><button class="positionchoice" style="left:50%" data-label="D"><span>↑</span>D</button></div>
<p class="muted">Choose A, B, C or D, or argue for a position of your own, and give a reason before the reveal.</p><p class="positionfeedback" aria-live="polite">Give a reason before revealing.</p>
<div class="zoomreveal"><h3>The same numbers drawn two ways</h3>
<p class="muted">Linear spacing, zoomed into the first thousandth of the line (0 to 1,000,000):</p>
<div class="zoomaxis"><b style="left:0%">0</b><b style="left:10%">100,000</b><b style="left:100%">1,000,000</b></div>
<p class="muted">Spacing by ×10 steps instead, so that each gap is one more multiplication by ten:</p>
<div class="zoomaxis logaxis"><b style="left:0%">1</b><b style="left:11.11%">10</b><b style="left:22.22%">10²</b><b style="left:33.33%">10³</b><b style="left:44.44%">10⁴</b><b class="hot" style="left:55.56%">10⁵</b><b style="left:66.67%">10⁶</b><b style="left:77.78%">10⁷</b><b style="left:88.89%">10⁸</b><b style="left:100%">10⁹</b></div></div>`,
r:`<strong>Closer to zero than A, by a factor of a hundred.</strong> 100,000 is one ten-thousandth of a billion, so on a line a kilometre long it sits only 10 cm from zero, while A is already 10 m along. When the line is spaced by ×10 steps instead, 100,000 lands five steps along, which is exactly the number of zeros it carries.`,
n:`Let every student commit to a letter before anyone speaks, then take two contrasting reasons. Every candidate is deliberately too far right, so ask whether any of A to D is defensible before revealing; most students will choose A or B and be surprised by how far out they are. The reveal shows both drawings at once, and the second drawing is the seed of the whole lesson: a position that records how many multiplications have happened.`},

{k:`02–03 min · Part 1 · Which kind of middle?`,
t:`Halfway between 1 and 100: is it 10 or 50.5?`,
c:`<div class="two"><div class="panel"><h3>Linear axis</h3><div class="sequence">1 ── ? ── 100</div><p>Equal differences either side.</p></div><div class="panel"><h3>Logarithmic axis</h3><div class="sequence">1 ── ? ── 100</div><p>Equal ratios either side.</p></div></div>
<p class="question">Which middle belongs to which axis, and on the ×10-step line from the opening, how many steps along are 1, 10 and 100?</p>`,
r:`<strong>Linear middle: 50.5. Logarithmic middle: √(1 × 100) = 10</strong>, since 10/1 = 100/10. On the ×10-step line the three numbers sit 0, 1 and 2 steps along, because 1 = 10⁰, 10 = 10¹ and 100 = 10², so on that line the middle really is an ordinary average of exponents, (0 + 2)/2 = 1.`,
n:`This follows the opening directly and turns its second drawing into a question about middles, which makes the ×10-step line feel like a genuine alternative ruler. The exponent of the geometric mean is the arithmetic mean of the exponents; once logarithms have a name this becomes "the logarithm of the geometric mean is the arithmetic mean of the logarithms", and it is worth saying so when the naming slide arrives.`},

{k:`03–05 min · Part 1 · Index laws by counting`,
t:`What happens to the count of ×10 steps when we multiply, divide or raise to a power?`,
c:`<p class="muted">Predict the two right-hand cells of each row before it is revealed.</p>
<table class="ptable"><tr><th>Calculation</th><th>As powers of ten</th><th>Count of steps</th></tr>
<tr><td>1,000 × 10,000</td><td data-step="1">10³ × 10⁴ = 10⁷</td><td data-step="1">3 + 4 = 7</td></tr>
<tr><td>10,000,000 ÷ 100</td><td data-step="2">10⁷ ÷ 10² = 10⁵</td><td data-step="2">7 − 2 = 5</td></tr>
<tr><td>100³</td><td data-step="3">(10²)³ = 10⁶</td><td data-step="3">3 × 2 = 6</td></tr>
<tr><td>10 ÷ 10</td><td data-step="4">10¹ ÷ 10¹ = 10⁰</td><td data-step="4">1 − 1 = 0</td></tr></table>`,
r:`<strong>Multiplying adds the counts, dividing subtracts them, and raising to a power multiplies them.</strong> For any base b: b<sup>m</sup> × b<sup>n</sup> = b<sup>m+n</sup>, b<sup>m</sup> ÷ b<sup>n</sup> = b<sup>m−n</sup>, (b<sup>m</sup>)<sup>k</sup> = b<sup>mk</sup>, and b<sup>0</sup> = 1. Keep this table in mind, because the logarithm laws later are this table read from the other side.`,
n:`These are the index laws, earned from counting zeros so that nobody needs them on trust. Write the four general laws on the board after the reveal and leave them there, since the straightening slide and the mapping table both return to them.`},

{k:`05–06 min · Part 1 · Two slow journeys`,
t:`Which takes longer: a fingernail growing 1 km, or saving £1,000,000,000 at £10,000 a year?`,
c:`<p class="muted">On the opening kilometre line, where 1 km stands for £1,000,000,000, each £10,000 is 1 cm.</p>
<div class="two"><div class="panel"><h3>Saving</h3><p class="eqline">£1,000,000,000 ÷ £10,000 per year</p><p class="eqline" data-step="1">10<sup>9</sup> ÷ 10<sup>4</sup> = 10<sup>5</sup></p><p data-step="1"><strong>100,000 years</strong>, moving 1 cm a year along the line</p></div><div class="panel"><h3>Fingernail</h3><p class="eqline">about 3.5 mm a month ≈ 4 cm a year</p><p class="eqline" data-step="2">1 km = 10<sup>5</sup> cm, and 10<sup>5</sup> ÷ 4 = 25,000</p><p data-step="2"><strong>about 25,000 years</strong>, moving 4 cm a year</p></div></div>
<p class="question">Predict first: which journey wins, and by roughly what factor?</p>`,
r:`<strong>The fingernail, by a factor of about four.</strong> Saving £10,000 a year creeps along the billion line at 1 cm a year, while a fingernail grows about 4 cm a year, so a lifetime of saving barely leaves the first metre. The division law does the heavy lifting: <span class="nw">10⁹ ÷ 10⁴ = 10⁵</span> in one step, by subtracting the counts of zeros.`,
n:`Take predictions before any arithmetic, since most students expect the money to win. Adult fingernails grow roughly 3 to 4 mm a month, varying with age and season; the round figure of 10 cm a year on the Cenotaph slide overstates this by about two and a half times, and with it the saving would take ten times as long as the nail. Either way the comparison makes the same point about how small 10,000 is beside 10⁹.`},

{k:`06–07 min · Check-in 1 · retrieves the opening`,
t:`Which of these is equal to 10,000,000?`,
c:`<div class="mcq" data-correct="0" data-explain="10⁵ × 10² = 10⁵⁺² = 10⁷, which has seven zeros."><button class="choice" data-option="0" data-wrong=""><b>A</b> · 10⁵ × 10²</button><button class="choice" data-option="1" data-wrong="Dividing subtracts the counts: 14 − 2 = 12, so this is 10¹²."><b>B</b> · 10¹⁴ ÷ 10²</button><button class="choice" data-option="2" data-wrong="The index laws are about multiplying; 10⁵ + 10² is 100,100."><b>C</b> · 10⁵ + 10²</button><button class="choice" data-option="3" data-wrong="A power of a power multiplies the counts: 2 × 5 = 10."><b>D</b> · (10²)⁵</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div>`,
r:`<strong>A.</strong> 10⁵ × 10² = 10⁷. Option C is the trap worth discussing: the laws describe multiplication, and there is no general index law that combines a sum by adding the exponents.`,
n:`Each wrong option corresponds to one misapplied law from the table. If C is popular, that is useful evidence to carry into the sum-trap question near the end.`},

{k:`07–08 min · Part 2 · Running the question backwards`,
t:`How many doublings take 1 to 32?`,
c:`<div class="hero">2<sup>□</sup> = 32</div><div class="sequence" data-step="1">1 → 2 → 4 → 8 → 16 → 32</div><p class="muted">The opening line counted ×10 steps; now count doublings, the steps we will use as a base on the next slides.</p>`,
r:`<strong>Five</strong>, because there are five arrows, so 2⁵ = 32. We know the base and the result, and we are asking for the exponent.`,
n:`Name the change of direction aloud: until now we were given the exponent and computed the number, and now the number is given and the exponent is missing.`},

{k:`08–09 min · Part 2 · Naming the question`,
t:`What do we call the missing exponent?`,
c:`<div class="hero">2<sup>5</sup> = 32 <span>⇔</span> log<sub>2</sub> 32 = 5</div><div class="hero" data-step="1">b<sup>x</sup> = N <span>⇔</span> log<sub>b</sub> N = x</div>
<p class="question">Rewrite 3⁴ = 81 as a logarithm, rewrite log<sub>10</sub> 100 = 2 as a power, and find log<sub>10</sub> 10,000,000.</p><p class="muted">For real logarithms we need b &gt; 0, b ≠ 1 and N &gt; 0.</p>`,
r:`<strong>log<sub>3</sub> 81 = 4</strong>, <strong>10² = 100</strong>, and <strong>log<sub>10</sub> 10,000,000 = 7</strong>. Read log<sub>b</sub> N as the question "b to what power gives N?", and the answer is always an exponent, which is the count of steps.`,
n:`Point to the base, input and answer in both statements. The third question closes the loop with Check-in 1 and the opening line: a position on the ×10 line is a logarithm, so 10,000,000 sits at 7.`},

{k:`09–11 min · Part 3 · What is a base?`,
t:`What if each place were worth only twice the place to its right?`,
c:`<p class="muted">In base 10, every digit of 19.375 counts a power of ten:</p>
<p class="eqline compact">19.375 = 1×10<sup>1</sup> + 9×10<sup>0</sup> + 3×10<sup>−1</sup> + 7×10<sup>−2</sup> + 5×10<sup>−3</sup></p>
<div class="two basetwo"><div><h3>The whole number 19 in base 2</h3><table class="ptable small"><tr><th>Place</th><th>Digit</th><th>Running total</th></tr>
<tr><td>2⁴ = 16</td><td data-step="1">1</td><td data-step="1">16</td></tr>
<tr><td>2³ = 8</td><td data-step="1">0</td><td data-step="1">16</td></tr>
<tr><td>2² = 4</td><td data-step="1">0</td><td data-step="1">16</td></tr>
<tr><td>2¹ = 2</td><td data-step="1">1</td><td data-step="1">18</td></tr>
<tr><td>2⁰ = 1</td><td data-step="1">1</td><td data-step="1">19</td></tr></table></div>
<div><h3>The fraction 0.375 in base 2</h3><table class="ptable small"><tr><th>Place</th><th>Digit</th><th>Running total</th></tr>
<tr><td>2⁻¹ = ½</td><td data-step="2">0</td><td data-step="2">19</td></tr>
<tr><td>2⁻² = ¼</td><td data-step="2">1</td><td data-step="2">19.25</td></tr>
<tr><td>2⁻³ = ⅛</td><td data-step="2">1</td><td data-step="2">19.375</td></tr></table></div></div>
<p class="eqline compact" data-step="3">19.375 = 1×2<sup>4</sup> + 0×2<sup>3</sup> + 0×2<sup>2</sup> + 1×2<sup>1</sup> + 1×2<sup>0</sup> + 0×2<sup>−1</sup> + 1×2<sup>−2</sup> + 1×2<sup>−3</sup></p>
<div class="placeequation" data-step="3">19.375<sub>10</sub> = 10011.011<sub>2</sub></div>
<p class="question">In base 10 the first place after the point counts tenths; what does it count in base 2, and why does 19.375 stop after three binary places?</p>`,
r:`<strong>Halves.</strong> Moving one place right divides by the base, so in base 2 the places run 4, 2, 1, ½, ¼, ⅛, just as in base 10 they run 10, 1, 0.1, 0.01, 0.001. The expansion stops because 0.375 = 3/8 = ¼ + ⅛, and 8 is a power of 2. The base is the multiplier between neighbouring places, and log<sub>2</sub> counts steps of exactly that size: the 1 in the 2⁴ place sits there because log<sub>2</sub> 16 = 4.`,
n:`Read the base-10 line aloud as "one ten, nine units, three tenths, seven hundredths, five thousandths", so that negative powers arrive as the continuation of dividing by ten. Build 19 with the class using "take the largest power of 2 that fits", then the fraction in three rows. The two expanded forms, one above the tables and one below, are the same sentence written with two different bases. If anyone asks about 19.32, the optional bank shows why its binary expansion never stops.`},

{k:`11–12 min · Check-in 2 · retrieves Part 3`,
t:`What number does <span class="m">101.11<sub>2</sub></span> represent?`,
c:`<div class="mcq" data-correct="0" data-explain="4 + 0 + 1 + ½ + ¼ = 5.75"><button class="choice" data-option="0" data-wrong=""><b>A</b> · 5.75</button><button class="choice" data-option="1" data-wrong="The places after the point count halves and quarters in base 2, not tenths and hundredths."><b>B</b> · 5.11</button><button class="choice" data-option="2" data-wrong="The digits look the same, but each place is worth a power of 2."><b>C</b> · 101.11</button><button class="choice" data-option="3" data-wrong="The second place after the point is worth ¼, not ½."><b>D</b> · 6</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div>`,
r:`<strong>5.75.</strong> The places are 2², 2¹, 2⁰, 2⁻¹ and 2⁻², worth 4, 2, 1, ½ and ¼, so <span class="m">101.11<sub>2</sub> = 4 + 1 + ½ + ¼</span>.`,
n:`If time is short, take this verbally with mini-whiteboards rather than through the buttons; it uses a different number from 19.375, so it tests the pattern of halves and quarters rather than recall of the example.`},

{k:`12–13 min · Part 4 · Two ways to grow`,
t:`Adding 2 each step or doubling each step: which wins, and when?`,
c:`<div class="two"><div class="panel"><h3>Adding: equal differences</h3><div class="sequence">1, 3, 5, 7, 9, …</div><p>a<sub>n</sub> = 1 + 2n</p></div><div class="panel"><h3>Doubling: equal ratios</h3><div class="sequence">1, 2, 4, 8, 16, …</div><p>g<sub>n</sub> = 2<sup>n</sup></p></div></div>
<div class="legend"><span style="color:#8ce1cb">● a = 1 + 2n</span> &nbsp; <span style="color:#ffca7b">● g = 2ⁿ</span></div><label for="graphstep">Plotting stage: <output id="graphn">axes only</output></label><input id="graphstep" type="range" min="0" max="8" value="0"><div class="two graphs"><div><h3>Ordinary vertical axis</h3><div id="lineargraph"></div></div><div><h3>Vertical axis spaced by doublings</h3><div id="loggraph"></div></div></div><p id="graphvalues" class="muted"></p>`,
r:`At n = 2 the adding rule leads, 5 to 4, but by n = 3 doubling has overtaken, 8 to 7, and it never looks back. On the right-hand axis every gridline is double the one below, so doubling climbs in <strong>equal steps</strong> and becomes a straight line, while the adding rule bends over.`,
n:`Begin with empty axes and ask for a prediction before each drag. The right-hand axis is the ×10 line from the opening slide turned upright and rebuilt with ×2 steps; say so explicitly, since that link is what lets students read the axis without a definition.`},

{k:`13–14 min · Part 4 · Three choices of axes`,
t:`Which pair of axes turns each rule into a straight line?`,
c:`<p class="muted">On a multiplicative (logarithmic) axis, equal distances mean equal multiplications, so 1, 2, 4 and 8 are evenly spaced.</p><label for="modelpick">Choose a relationship</label> <select id="modelpick"><option value="square">Square law · y = x²</option><option value="cube">Cube law · y = x³</option><option value="inverse">Inverse-square law · y = x⁻²</option><option value="root">Square-root law · y = x½</option><option value="exponential">Exponential · y = 2ˣ</option></select><label for="modelstage">Plotting stage: <output id="modelstageout">axes only</output></label><input id="modelstage" type="range" min="0" max="5" value="0"><div class="threegraphs"><div><h3>Linear / linear</h3><div id="plotplain"></div></div><div><h3>Linear x / log y (semi-log)</h3><div id="plotsemi"></div></div><div><h3>Log x / log y (log-log)</h3><div id="plotboth"></div></div></div><p id="modelcaption" class="muted"></p>`,
r:`<strong>Power laws y = x<sup>p</sup> are straight on log-log axes, and the exponential y = 2<sup>x</sup> is straight on semi-log axes.</strong> Doubling x multiplies x² by 4 every time, so equal multiplications across give equal multiplications up; adding 1 to x doubles 2ˣ every time, so equal additions across give equal multiplications up. The explanation comes once we can move between bases with logarithms.`,
n:`Try the square law first, then the exponential, and only use the others if time allows. Leave the why open: the straightening slide, straight after the base-conversion slide, answers it with logarithms.`},

{k:`14–15 min · Check-in 3 · retrieves Part 4`,
t:`On which axes is y = 5 × 3ˣ a straight line?`,
c:`<div class="mcq" data-correct="1" data-explain="Adding 1 to x multiplies y by 3 every time, so equal steps across give equal multiplications up: semi-log."><button class="choice" data-option="0" data-wrong="Each step multiplies y by 3, so the graph curves upward on ordinary axes."><b>A</b> · linear x / linear y</button><button class="choice" data-option="1" data-wrong=""><b>B</b> · linear x / log y</button><button class="choice" data-option="2" data-wrong="x itself grows by adding, so the horizontal axis should stay ordinary."><b>C</b> · log x / log y</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div><details class="equationhint"><summary>Hint</summary><p>Work out y at x = 0, 1, 2, 3. What does each step do to y?</p></details>`,
r:`<strong>B, semi-log.</strong> The values 5, 15, 45, 135 grow by ×3 for each +1 in x, and the factor 5 only shifts the starting height.`,
n:`A new example, deliberately not one on the explorer, so students must reason rather than recall a picture.`},

{k:`15–17 min · Part 5 · Logarithms and bases`,
t:`How many digits does 19.375 need before the point, in base 10 and in base 2?`,
c:`<div class="two"><div class="panel"><h3>Base 10</h3><p class="eqline">10¹ ≤ 19.375 &lt; 10²</p><p class="eqline" data-step="1">log<sub>10</sub> 19.375 ≈ 1.29</p><p data-step="1">Between 1 and 2, so <strong>2 digits</strong>: 19</p></div><div class="panel"><h3>Base 2</h3><p class="eqline">2⁴ ≤ 19.375 &lt; 2⁵</p><p class="eqline" data-step="2">log<sub>2</sub> 19.375 ≈ 4.28</p><p data-step="2">Between 4 and 5, so <strong>5 digits</strong>: 10011</p></div></div>
<div class="panel" data-step="3" style="margin-top:18px"><h3>Converting between the two</h3><p class="eqline">19.375 ≈ 10<sup>1.29</sup> and 10 ≈ 2<sup>3.32</sup></p><p class="eqline">so 19.375 ≈ (2<sup>3.32</sup>)<sup>1.29</sup> = 2<sup>3.32 × 1.29</sup> ≈ 2<sup>4.28</sup></p></div>
<p class="question">Why is the base-2 logarithm always about 3.32 times the base-10 logarithm?</p>`,
r:`<strong>Because log<sub>2</sub> 10 ≈ 3.32</strong>: each ×10 step is worth about 3.32 doublings, so counting the same journey in doublings always gives about 3.32 times as many steps, and <span class="nw">log<sub>2</sub> N = log<sub>10</sub> N × log<sub>2</sub> 10</span>. This is also why a large number needs roughly 3.32 times as many binary digits as decimal ones, since the number of digits before the point is one more than the whole-number part of its logarithm.`,
n:`This retrieves the place-value slide and previews the power law of logarithms through the power-of-a-power index law, so it sits naturally before the mapping table. The decimal values come from a calculator and are rounded; the bracketing inequalities are the part students should be able to produce themselves. If time is short, stop after the two panels and leave the conversion for the follow-up lesson.`},

{k:`17–18 min · Part 5 · Why the axes straighten`,
t:`Why did the log‑log and semi‑log axes straighten those curves?`,
c:`<div class="two"><div class="panel"><h3>Power law</h3><div class="equation">y = x<sup>3</sup></div><p class="muted" data-step="1">Take log<sub>2</sub> of both sides; the power of 3 comes out in front, as on the last slide:</p><p class="eqline" data-step="1">log<sub>2</sub> y = 3 log<sub>2</sub> x</p><p class="muted" data-step="1">With Y = log<sub>2</sub> y and X = log<sub>2</sub> x:</p><p class="eqline" data-step="1"><strong>Y = 3X</strong></p></div><div class="panel"><h3>Exponential</h3><div class="equation">y = 5 × 3<sup>x</sup></div><p class="muted" data-step="2">Take log<sub>3</sub> of both sides; multiplying becomes adding:</p><p class="eqline" data-step="2">log<sub>3</sub> y = log<sub>3</sub> 5 + log<sub>3</sub> 3<sup>x</sup></p><p class="eqline" data-step="2"><span class="eqpad">=</span> log<sub>3</sub> 5 + x</p><p class="muted" data-step="2">With Y = log<sub>3</sub> y against x:</p><p class="eqline" data-step="2"><strong>Y = x + log<sub>3</sub> 5</strong></p></div></div>
<p class="question">Which axes does each equation need, and what is the gradient of each straight line?</p>`,
r:`<strong><span class="nw">y = x³</span> needs both axes logarithmic and gives gradient 3; <span class="nw">y = 5 × 3ˣ</span> needs only the vertical axis logarithmic and gives gradient 1 in base-3 units.</strong> Taking logs turns multiplication into addition and powers into multiplication, which is exactly what turns these curves into straight lines of the form Y = mX + c.`,
n:`This keeps the promise of the three-axes slide, and the two moves it relies on, a power coming out in front and a product becoming a sum, are exactly the rows of the mapping table that follows, so the table arrives as a justification of something students have just watched work. If time is tight, show only the power-law panel; an index-law version without log notation is in the optional bank.`},

{k:`18–23 min · Part 5 · Index laws become log laws`,
t:`If a logarithm is an exponent, what do the index laws say about logarithms?`,
c:`<p class="lead">Key: if M = b<sup>m</sup>, then log<sub>b</sub> M = m.</p>
<div class="tablewrap"><table class="ptable maptable"><tr><th></th><th>Index law</th><th>Name the powers</th><th>Take log<sub>b</sub></th><th>Log law</th><th>Check</th></tr>
<tr><th>Multiply</th><td>b<sup>m</sup> × b<sup>n</sup> = b<sup>m+n</sup></td><td data-step="1">M = b<sup>m</sup>, N = b<sup>n</sup><br>so MN = b<sup>m+n</sup></td><td data-step="2">log<sub>b</sub>(MN) = m + n</td><td data-step="3">log<sub>b</sub>(MN) =<br>log<sub>b</sub> M + log<sub>b</sub> N</td><td data-step="3">log<sub>10</sub>(1000 × 10,000)<br>= 3 + 4 = 7</td></tr>
<tr><th>Divide</th><td>b<sup>m</sup> ÷ b<sup>n</sup> = b<sup>m−n</sup></td><td data-step="4">M ÷ N = b<sup>m−n</sup></td><td data-step="4">log<sub>b</sub>(M ÷ N) = m − n</td><td data-step="4">log<sub>b</sub>(M ÷ N) =<br>log<sub>b</sub> M − log<sub>b</sub> N</td><td data-step="4">log<sub>2</sub>(32 ÷ 4)<br>= 5 − 2 = 3</td></tr>
<tr><th>Power</th><td>(b<sup>m</sup>)<sup>k</sup> = b<sup>mk</sup></td><td data-step="5">M<sup>k</sup> = b<sup>mk</sup></td><td data-step="5">log<sub>b</sub>(M<sup>k</sup>) = mk</td><td data-step="5">log<sub>b</sub>(M<sup>k</sup>) = k log<sub>b</sub> M</td><td data-step="5">log<sub>2</sub>(8²) = 2 × 3 = 6</td></tr>
<tr><th>Zero</th><td>b<sup>0</sup> = 1</td><td data-step="6">1 = b<sup>0</sup></td><td data-step="6">log<sub>b</sub> 1 = 0</td><td data-step="6">log<sub>b</sub> 1 = 0</td><td data-step="6">log<sub>7</sub> 1 = 0</td></tr></table></div>
<p class="question">Complete the sentence: logarithms turn multiplying into ___, dividing into ___, and raising to a power into ___.</p>`,
r:`<strong>Adding, subtracting and multiplying.</strong> Each log law is an index law read through the key: because log<sub>b</sub> M is the exponent m, whatever the index laws do to exponents, the log laws do to logarithms. These hold for one base b throughout, with b &gt; 0, b ≠ 1 and positive inputs.`,
n:`Walk the multiply row slowly across three clicks, narrating each column as a translation rather than a new rule. Then hand over: students write the divide and power rows themselves before each is revealed in one click. The check column uses examples from earlier slides, so every row is also a retrieval of Parts 1 and 2, and the multiply and power rows justify the two moves just made on the straightening slide.`},

{k:`23–24 min · Check-in 4 · product law`,
t:`What is log<sub>10</sub>(100 × 1000)?`,
c:`<div class="mcq" data-correct="1" data-explain="100 × 1000 = 10⁵, or by the product law 2 + 3 = 5."><button class="choice" data-option="0" data-wrong="Multiplying the logarithms gives 2 × 3 = 6; the product law adds them."><b>A</b> · 6</button><button class="choice" data-option="1" data-wrong=""><b>B</b> · 5</button><button class="choice" data-option="2" data-wrong="Dividing the logarithms is not a law of any kind."><b>C</b> · 3/2</button><button class="choice" data-option="3" data-wrong="100,000 is the input; its logarithm is the exponent."><b>D</b> · 100,000</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div>`,
r:`<strong>5</strong>, because 100 × 1000 = 10⁵, and the product law gives the same answer as 2 + 3.`,
n:`Ask for two methods: computing the product first, and using the law. Their agreement is the point.`},

{k:`24–25 min · Check-in 5 · a sum is a different operation`,
t:`What is log<sub>2</sub>(4 + 4)?`,
c:`<div class="mcq" data-correct="1" data-explain="log₂(4 + 4) = log₂ 8 = 3, whereas log₂ 4 + log₂ 4 = 4 corresponds to log₂(4 × 4)."><button class="choice" data-option="0" data-wrong="You have added two logarithms, which matches log₂(4 × 4), not log₂(4 + 4)."><b>A</b> · 4</button><button class="choice" data-option="1" data-wrong=""><b>B</b> · 3</button><button class="choice" data-option="2" data-wrong="2² = 4, but the whole input is 8."><b>C</b> · 2</button><button class="choice" data-option="3" data-wrong="8 is the input, not the exponent."><b>D</b> · 8</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div>`,
r:`<strong>3</strong>, since 4 + 4 = 8 = 2³. There is no law for the logarithm of a sum, for the same reason that in Check-in 1 there was no general index law that combines a sum such as 10⁵ + 10² by adding the exponents.`,
n:`Link explicitly back to option C of Check-in 1: the same misconception, now in logarithm clothing.`},

{k:`25–30 min · Independent exit check`,
t:`Can you explain each answer with a power?`,
c:`<ol class="exit"><li>Find log<sub>10</sub> 10,000,000 and write the checking power.</li><li>Find log<sub>7</sub> 1 and write the checking power.</li><li>log<sub>2</sub> 8 + log<sub>2</sub> 4 = log<sub>2</sub> □. What is □, and what is the value?</li><li>Complete: “log<sub>b</sub> N asks…”</li></ol><p class="muted">Work independently; the explanation matters as much as the value.</p>`,
r:`<strong>1.</strong> 7, because 10⁷ = 10,000,000.<br><strong>2.</strong> 0, because 7⁰ = 1.<br><strong>3.</strong> □ = 32, because 8 × 4 = 32, and the value is 3 + 2 = 5, since 2⁵ = 32.<br><strong>4.</strong> “to what power must b be raised to give N?”`,
n:`Collect all responses. Question 1 retrieves the opening, question 2 the zero row, question 3 the product law, and question 4 the definition, so the four together tell you which part of the lesson to revisit. End the core lesson here.`},

{k:`Optional bank · Between the integers`,
t:`Must a logarithm be a whole number?`,
c:`<p class="question">Since 2³ = 8 and 2⁴ = 16, where must log<sub>2</sub> 10 lie?</p><p class="question">Moving backwards through 8, 4, 2, 1, ½, what is log<sub>2</sub> ½?</p>`,
r:`<strong>3 &lt; log<sub>2</sub> 10 &lt; 4</strong>, and <strong>log<sub>2</sub> ½ = −1</strong> because 2⁻¹ = ½, the same negative place value as in the base-2 table.`,
n:`A good stretch if students finish the exit check early; the second part connects back to the binary place values.`},

{k:`Optional bank · Different bases`,
t:`Why are log<sub>2</sub> 64 and log<sub>4</sub> 64 different?`,
c:`<div class="two"><div class="panel"><h3>Doubling</h3><div class="equation">2<sup>6</sup> = 64</div></div><div class="panel"><h3>Multiplying by four</h3><div class="equation">4<sup>3</sup> = 64</div></div></div>`,
r:`<strong>6 and 3.</strong> Each ×4 step is two ×2 steps, so the same target needs half as many of the larger steps.`,
n:`Consolidates the base as a step size without introducing change of base.`},

{k:`Optional bank · Quotient and power laws`,
t:`What is log<sub>2</sub>(8²)?`,
c:`<div class="mcq" data-correct="1" data-explain="8² = 64 = 2⁶, or 2 × log₂ 8 = 2 × 3."><button class="choice" data-option="0" data-wrong="Squaring log₂ 8 gives 9; the exponent instead multiplies the logarithm."><b>A</b> · 9</button><button class="choice" data-option="1" data-wrong=""><b>B</b> · 6</button><button class="choice" data-option="2" data-wrong="A power of a power multiplies exponents: 3 × 2."><b>C</b> · 5</button><button class="choice" data-option="3" data-wrong="2³² is far larger than 64."><b>D</b> · 32</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div>`,
r:`<strong>6</strong>, because 8² = 64 = 2⁶.`,
n:`Use if the power row of the mapping table needs reinforcing.`},

{k:`Optional bank · Spot the false statement`,
t:`Which statement is false?`,
c:`<div class="mcq" data-correct="2" data-explain="log₁₀(10/1000) = 1 − 3 = −2, not 1/3."><button class="choice" data-option="0" data-wrong="True: 1000/100 = 10."><b>A</b> · log₁₀(1000/100) = 1</button><button class="choice" data-option="1" data-wrong="True: 1/100 = 10⁻²."><b>B</b> · log₁₀(1/100) = −2</button><button class="choice" data-option="2" data-wrong=""><b>C</b> · log₁₀(10/1000) = 1/3</button><button class="choice" data-option="3" data-wrong="True: the negative exponent represents a reciprocal."><b>D</b> · log₁₀(10/1000) = −2</button><p class="mcqfeedback" aria-live="polite">Choose an answer, then explain why.</p></div>`,
r:`<strong>C</strong> is false: the quotient law subtracts logarithms, so the answer is 1 − 3 = −2.`,
n:`Pairs well with the base-10 place-value table, where 10⁻² first appeared.`},

{k:`Optional bank · Compound growth`,
t:`When will £100 growing at 10% a year double?`,
c:`<div class="hero">A = 100 × 1.1<sup>n</sup></div><p class="question">Why 1.1, and which logarithm answers the question?</p>`,
r:`Keeping 100% and adding 10% gives the factor <strong>1.1</strong>. Doubling needs 1.1<sup>n</sup> = 2, so <strong>n = log<sub>1.1</sub> 2 ≈ 7.27</strong>, and with annual crediting the balance first exceeds £200 after 8 full years.`,
n:`A natural follow-up lesson starter.`},

{k:`Optional bank · Straightening without log notation`,
t:`Can the index laws alone explain why the axes straighten?`,
c:`<p class="muted">A logarithmic axis places each number by its exponent, so ask what the index laws do to exponents.</p>
<div class="two"><div class="panel"><h3>Power law</h3><div class="equation">y = x³</div><p class="muted" data-step="1">Write x as a power of 2, x = 2<sup>X</sup>:</p><p class="eqline" data-step="1">y = (2<sup>X</sup>)<sup>3</sup> = 2<sup>3X</sup></p><p class="muted" data-step="1">So the exponent of y is</p><p class="eqline" data-step="1"><strong>Y = 3X</strong></p></div><div class="panel"><h3>Exponential</h3><div class="equation">y = 5 × 3<sup>x</sup></div><p class="muted" data-step="2">Write 5 as a power of 3, 5 ≈ 3<sup>1.46</sup>:</p><p class="eqline" data-step="2">y ≈ 3<sup>1.46</sup> × 3<sup>x</sup> = 3<sup>x + 1.46</sup></p><p class="muted" data-step="2">So the exponent of y is</p><p class="eqline" data-step="2"><strong>Y = x + 1.46</strong></p></div></div>
<p class="question">Which axes does each equation need, and what is the gradient of each straight line?</p>`,
r:`<strong><span class="nw">y = x³</span> needs both axes to measure exponents and gives gradient 3; <span class="nw">y = 5 × 3ˣ</span> needs only the vertical axis to measure exponents and gives gradient 1, crossing at 1.46.</strong> The power-of-a-power law turned the cube into multiplication of an exponent by 3, and the product law turned the factor 5 into an added constant, which is exactly what makes these graphs straight lines of the form Y = mX + c.`,
n:`An alternative to the core straightening slide for a group that has the index laws but not yet logarithms. The exponents X and Y are logarithms in everything but name, and the naming slide says so explicitly; that link is worth a sentence when you get there. If time is tight, show only the power-law panel.`},

{k:`Optional bank · Counting multiplications`,
t:`How many ×10 steps take 1 to 10,000,000?`,
c:`<div class="hero">10,000,000 = 10<sup>□</sup></div>
<div class="sequence" data-step="1">1 → 10 → 100 → 1,000 → 10,000 → 100,000 → 1,000,000 → 10,000,000</div>
<p class="question">How many steps reach the 100,000 from the opening slide, how many reach 1,000,000,000, and which number do we reach after zero steps?</p>`,
r:`<strong>Seven steps</strong>, so 10,000,000 = 10⁷; 100,000 is five steps, 10⁵, and a billion is nine, 10⁹. Taking zero steps leaves us at 1, which is why 10⁰ = 1. The exponent counts multiplications by the base; before long we will give that count a name.`,
n:`Press Next once to show the chain, then ask a student to count the arrows aloud rather than the numbers, since eight numbers mark seven changes. The zero-step question plants 10⁰ = 1 early, so that log of 1 equals 0 later feels obvious rather than ruled.`},

{k:`Optional bank · Base-ten place value as a table`,
t:`What does each digit of 19.32 actually count?`,
c:`<table class="ptable"><tr><th>Place</th><th>Power of 10</th><th>Digit</th><th>Contribution</th></tr>
<tr><td>tens</td><td>10¹ = 10</td><td>1</td><td data-step="1">1 × 10 = 10</td></tr>
<tr><td>units</td><td>10⁰ = 1</td><td>9</td><td data-step="1">9 × 1 = 9</td></tr>
<tr><td>tenths</td><td>10⁻¹ = 0.1</td><td>3</td><td data-step="2">3 × 0.1 = 0.3</td></tr>
<tr><td>hundredths</td><td>10⁻² = 0.01</td><td>2</td><td data-step="2">2 × 0.01 = 0.02</td></tr>
<tr class="total"><td colspan="3">Total</td><td data-step="3">19.32</td></tr></table>
<p class="question">What happens to the place value each time you move one column to the right?</p>`,
r:`<strong>It is divided by 10 each time, and that factor of 10 is what we mean by the base.</strong> Moving right through the places continues the powers below zero, so 10⁻¹ = 1/10 and 10⁻² = 1/100. In standard form 19.32 = 1.932 × 10¹.`,
n:`Read each row aloud as a sentence, "one ten, nine units, three tenths". Negative exponents arrive here quietly as the natural continuation of dividing by 10, which saves introducing them as a separate rule.`},

{k:`Optional bank · 19.32 in base 2 in full`,
t:`How close can base 2 get to 19.32?`,
c:`<div class="two basetwo"><div><h3>Whole-number part: 19</h3><table class="ptable small"><tr><th>Place</th><th>Digit</th><th>Running total</th></tr>
<tr><td>2⁴ = 16</td><td data-step="1">1</td><td data-step="1">16</td></tr>
<tr><td>2³ = 8</td><td data-step="1">0</td><td data-step="1">16</td></tr>
<tr><td>2² = 4</td><td data-step="1">0</td><td data-step="1">16</td></tr>
<tr><td>2¹ = 2</td><td data-step="1">1</td><td data-step="1">18</td></tr>
<tr><td>2⁰ = 1</td><td data-step="1">1</td><td data-step="1">19</td></tr></table></div>
<div><h3>Fractional part: 0.32</h3><table class="ptable small"><tr><th>Place</th><th>Digit</th><th>Running total</th></tr>
<tr><td>2⁻¹ = 0.5</td><td data-step="2">0</td><td data-step="2">19</td></tr>
<tr><td>2⁻² = 0.25</td><td data-step="2">1</td><td data-step="2">19.25</td></tr>
<tr><td>2⁻³ = 0.125</td><td data-step="2">0</td><td data-step="2">19.25</td></tr>
<tr><td>2⁻⁴ = 0.0625</td><td data-step="2">1</td><td data-step="2">19.3125</td></tr>
<tr><td>2⁻⁵ to 2⁻⁷</td><td data-step="3">0 0 0</td><td data-step="3">19.3125</td></tr>
<tr><td>2⁻⁸ ≈ 0.0039</td><td data-step="3">1</td><td data-step="3">19.31640625</td></tr>
<tr><td>2⁻⁹ ≈ 0.0020</td><td data-step="3">1</td><td data-step="3">19.318359375</td></tr>
<tr><td>2⁻¹⁰ ≈ 0.0010</td><td data-step="3">1</td><td data-step="3">19.3193359375</td></tr>

<div class="placeequation" data-step="4">19.32<sub>10</sub> = 10011.01010001111…<sub>2</sub></div>
<p class="question">Will the binary digits ever stop at exactly 19.32?</p>`,
r:`<strong>No.</strong> 0.32 = 8/25, and no sum of halves, quarters, eighths and so on can make a denominator of 25, so the running total creeps towards 19.32 for ever without arriving. The base is the multiplier between neighbouring places; changing it changes the digits, never the number.`,
n:`A contrast with 19.375 in the core lesson, whose binary expansion stops after three places because 0.375 = 3/8. The running-total column carries the argument, since students can see it approach 19.32 without landing. This is the link to logarithms, since a base is a step size and a logarithm will count steps of that size.`},

{k:`Optional bank · Return to the scale`,
t:`Why does each ×10 step add 1 to the logarithm?`,
c:`<label for="power">Exponent x: <output id="exp">3</output></label><input id="power" type="range" min="0" max="6" step="1" value="3"><div class="hero" id="powerout"></div><div id="ticks" class="ticks"></div>`,
r:`The logarithm records the exponent, and multiplying by 10 raises the exponent by 1: <strong>10³ × 10 = 10⁴</strong>. On a base-10 logarithmic scale, positions measure these exponents.`,
n:`The evenly spaced ticks are exponent positions while the labels show the original numbers.`},

{k:`Teacher reference · The 30 minutes reappraised`,
t:`What must happen in the 30 minutes, and what can give way?`,
c:`<table class="ptable small"><tr><th>Minutes</th><th>Slides</th><th>Purpose</th><th>If behind</th></tr>
<tr><td>00–05</td><td>1–3 · scale, middle, index laws</td><td>Positions on a ×10 line are exponents; multiplying adds them</td><td>Take the middle in one sentence and move on</td></tr>
<tr><td>05–07</td><td>4–5 · fingernail, Check-in 1</td><td>Index laws used on a striking comparison; sum trap planted</td><td>Predict-and-reveal only, no working</td></tr>
<tr><td>07–09</td><td>6–7 · 2<sup>□</sup> = 32, naming</td><td>The logarithm defined as the missing exponent</td><td><strong>Never cut</strong></td></tr>
<tr><td>09–12</td><td>8–9 · 19.375, Check-in 2</td><td>A base is the multiplier between places</td><td>Take Check-in 2 on mini-whiteboards</td></tr>
<tr><td>12–15</td><td>10–12 · growth, axes, Check-in 3</td><td>Multiplicative axes straighten exponentials and power laws</td><td>Skip slide 10; square law and 2ˣ only on slide 11</td></tr>
<tr><td>15–18</td><td>13–14 · digits, straightening</td><td>Logarithms move between bases and explain the axes</td><td>Stop slide 13 before the conversion; power-law panel only on 14</td></tr>
<tr><td>18–23</td><td>15 · mapping table</td><td>Each log law is an index law read through the definition</td><td><strong>Never cut</strong>; the multiply row slowly, the rest predicted</td></tr>
<tr><td>23–30</td><td>16–18 · Check-ins 4 and 5, exit</td><td>Evidence of understanding for the observers</td><td>Keep Check-in 5 and the exit; drop Check-in 4</td></tr></table>
<p class="muted">Eighteen core slides in thirty minutes leaves under two minutes each, which is ambitious for a group meeting logarithms for the first time. The non-negotiable spine is slides 1, 3, 6, 7, 8, 15, 17 and 18; everything else is there to deepen understanding and should give way before the mapping table or the exit check is rushed.</p>`,

let index=0,notesOn=false;const deck=document.getElementById('deck');
deck.innerHTML=slides.map((s,i)=>`<section class="slide" data-slide="${i}" style="display:none"><div class="eyebrow">${s.k}</div><h1>${s.t}</h1>${s.c}${s.r?`<div class="answer" role="region" aria-label="Answer">${s.r}</div>`:''}<aside class="notes">${s.n}</aside></section>`).join('');

function current(){return deck.children[index]}function answer(){return current().querySelector('.answer')}
function pendingStep(){const hidden=[...current().querySelectorAll('[data-step]:not(.shown)')].map(e=>+e.dataset.step);return hidden.length?Math.min(...hidden):null}
function revealStep(n){current().querySelectorAll(`[data-step="${n}"]`).forEach(e=>e.classList.add('shown'));show(index)}
function show(i){index=Math.max(0,Math.min(slides.length-1,i));[...deck.children].forEach((s,j)=>s.style.display=j===index?'block':'none');document.querySelectorAll('.notes').forEach(n=>n.classList.toggle('visible',notesOn));jump.value=index;document.getElementById('count').textContent=`${index+1} / ${slides.length}`;document.getElementById('progress').style.width=`${(index+1)/slides.length*100}%`;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1&&pendingStep()===null&&(!answer()||answer().classList.contains('visible'));document.getElementById('reveal').disabled=!answer();document.getElementById('reveal').setAttribute('aria-expanded',String(!!answer()?.classList.contains('visible')));try{history.replaceState(null,'','#slide='+(index+1))}catch(e){}}
function toggleAnswer(){answer()?.classList.toggle('visible');scaleAnswers();show(index)}
function next(){const p=pendingStep();if(p!==null){revealStep(p);return}if(answer()&&!answer().classList.contains('visible'))toggleAnswer();else{show(index+1);window.scrollTo(0,0)}}
function toggleNotes(){notesOn=!notesOn;document.getElementById('notes').setAttribute('aria-pressed',String(notesOn));show(index)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('full').textContent='Use browser fullscreen'}}
document.getElementById('prev').onclick=()=>{show(index-1);window.scrollTo(0,0)};document.getElementById('next').onclick=next;document.getElementById('reveal').onclick=toggleAnswer;document.getElementById('notes').onclick=toggleNotes;document.getElementById('full').onclick=fullscreen;document.getElementById('print').onclick=()=>window.print();jump.onchange=()=>{show(+jump.value);window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key.toLowerCase()==='r')toggleAnswer();if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
const power=document.getElementById('power');function update(){const x=+power.value,n=10**x;document.getElementById('exp').textContent=x;document.getElementById('powerout').innerHTML=`10<sup>${x}</sup> = ${n.toLocaleString('en-GB')}<br>log<sub>10</sub> ${n.toLocaleString('en-GB')} = ${x}`;document.getElementById('ticks').innerHTML=Array.from({length:7},(_,i)=>`<b class="${i===x?'active':''}">${(10**i).toLocaleString('en-GB')}</b>`).join('')}if(power){power.oninput=update;update()}
function scaleAnswers(){document.querySelectorAll('.zoomreveal').forEach(el=>el.classList.toggle('visible',el.closest('.slide').querySelector('.answer').classList.contains('visible')));}
function drawGraph(log){const W=520,H=280,l=58,r=18,t=18,b=42;const X=n=>l+n/6*(W-l-r),Y=v=>H-b-(log?Math.log2(v)/6:v/64)*(H-t-b);let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Arithmetic and geometric progressions on ${log?'logarithmic':'linear'} vertical axis"><g font-family="system-ui" font-size="13" fill="#c4d4df">`;for(const v of(log?[1,2,4,8,16,32,64]:[0,16,32,48,64]))out+=`<path d="M${l},${Y(v)}H${W-r}" stroke="#3b5260"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;for(let n=0;n<=6;n++)out+=`<text x="${X(n)}" y="${H-18}" text-anchor="middle">${n}</text>`;out+=`<text x="${W-12}" y="${H-3}" text-anchor="end">step n</text><text x="5" y="12">value</text></g>`;const stage=+document.getElementById('graphstep').value;for(const [f,color]of [[n=>1+2*n,'#8ce1cb'],[n=>2**n,'#ffca7b']]){let path='';for(let i=0;i<=120;i++){let n=i/20;path+=(i?'L':'M')+X(n)+','+Y(f(n));}if(stage===8)out+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`;for(let n=0;n<Math.min(stage,7);n++)out+=`<circle cx="${X(n)}" cy="${Y(f(n))}" r="${n===Math.min(stage-1,6)?6:3}" fill="${color}"/>`;}return out+'</svg>'}
function graphs(){const stage=+document.getElementById('graphstep').value,n=Math.min(stage-1,6);document.getElementById('graphn').textContent=stage===0?'axes only':stage===8?'join the points':'reveal n = '+n;document.getElementById('lineargraph').innerHTML=drawGraph(false);document.getElementById('loggraph').innerHTML=drawGraph(true);document.getElementById('graphvalues').textContent=stage===0?'Predict the first values at n = 0.':stage===8?'All seven pairs are plotted. The curves show the continuous extensions of the two rules.':`At n = ${n}: arithmetic value = ${1+2*n}; geometric value = ${2**n}. Predict n = ${n+1} before moving on.`;}document.getElementById('graphstep').oninput=graphs;graphs();

const modelDefs={square:{f:x=>x*x,label:'y = x²: doubling x multiplies y by 4. Log-log slope 2.',lo:1,hi:64},cube:{f:x=>x**3,label:'y = x³: doubling x multiplies y by 8. Log-log slope 3.',lo:1,hi:512},inverse:{f:x=>x**-2,label:'y = x⁻²: doubling x divides y by 4. Log-log slope −2.',lo:1/64,hi:1},root:{f:x=>Math.sqrt(x),label:'y = √x: doubling x multiplies y by √2. Log-log slope ½.',lo:1,hi:4},exponential:{f:x=>2**x,label:'y = 2ˣ: increasing x by 1 doubles y. The semi-log panel is straight.',lo:2,hi:256}};
function fmt(v){if(v===0)return '0';if(v>=1)return Number(v.toPrecision(4)).toString();return '1/'+Math.round(1/v)}
function modelPlot(mode,m){let W=370,H=280,L=58,R=16,T=20,B=42;let xlog=mode==='both',ylog=mode!=='plain';let ylo=ylog?Math.log2(m.lo):0,yhi=ylog?Math.log2(m.hi):m.hi;let X=x=>L+((xlog?Math.log2(x)/3:(x-1)/7))*(W-L-R),Y=y=>H-B-((ylog?Math.log2(y):y)-ylo)/(yhi-ylo)*(H-T-B);let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${mode} axes for selected model"><g fill="#bed0dc" font-size="12">`;let yt=[];if(ylog){for(let a=ylo;a<=yhi+.001;a+=(yhi-ylo>6?2:1))yt.push(2**a);if(yt[yt.length-1]!==m.hi)yt.push(m.hi)}else yt=[0,m.hi/4,m.hi/2,m.hi*3/4,m.hi];for(let v of yt)out+=`<path d="M${L},${Y(v)}H${W-R}" stroke="#3a505e"/><text x="${L-7}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;for(let v of(xlog?[1,2,4,8]:[1,2,3,4,5,6,7,8]))out+=`<path d="M${X(v)},${T}V${H-B}" stroke="#2d414f"/><text x="${X(v)}" y="${H-20}" text-anchor="middle">${v}</text>`;out+=`<text x="${W-15}" y="${H-3}">x</text><text x="8" y="15">y</text></g>`;let d='';for(let i=0;i<=160;i++){let x=1+7*i/160;d+=(i?'L':'M')+X(x)+','+Y(m.f(x))}const stage=+document.getElementById("modelstage").value;if(stage===5)out+=`<path d="${d}" fill="none" stroke="#8ce1cb" stroke-width="3"/>`;for(let x of[1,2,4,8].slice(0,Math.min(stage,4)))out+=`<circle cx="${X(x)}" cy="${Y(m.f(x))}" r="5" fill="#ffca7b"/>`;return out+'</svg>'}
function modelUpdate(){const m=modelDefs[document.getElementById('modelpick').value];for(const [id,mode]of[['plotplain','plain'],['plotsemi','semi'],['plotboth','both']])document.getElementById(id).innerHTML=modelPlot(mode,m);const stage=+document.getElementById('modelstage').value;document.getElementById('modelstageout').textContent=stage===0?'axes only':stage===5?'join the points':stage+' point'+(stage>1?'s':'');document.getElementById('modelcaption').textContent=stage===0?'Predict the point at x = 1 before dragging.':stage<4?'Predict the next point at x = '+[1,2,4,8][stage]+'.':stage===4?'All four points are visible. Drag once more to join them.':'The curve joins the revealed points through the selected continuous model.'}document.getElementById('modelpick').onchange=()=>{document.getElementById('modelstage').value=0;modelUpdate()};document.getElementById('modelstage').oninput=modelUpdate;modelUpdate();
