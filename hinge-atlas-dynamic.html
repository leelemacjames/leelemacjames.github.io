<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hinge Atlas</title>
<style>
:root{--ink:#0b0d10;--plate:#12151a;--plate2:#171b21;--rule:#262b33;--paper:#e6e2d9;--muted:#939aa6;--faint:#5d6570;--accent:#c5a05e;--serif:Georgia,serif;--mono:ui-monospace,monospace}

.shell{display:grid;grid-template-columns:245px 1fr 330px;height:calc(100vh - 108px)}aside{background:var(--plate);padding:16px;overflow:auto}.left{border-right:1px solid var(--rule)}.right{border-left:1px solid var(--rule)}
.rail{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);padding-bottom:6px}.block{margin-bottom:20px}
.mode{width:100%;text-align:left;background:none;border:1px solid var(--rule);color:var(--muted);padding:7px 9px;margin:4px 0;cursor:pointer}.mode.active{background:var(--paper);color:var(--ink)}
.legend{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer}.legend.off{opacity:.3}.sw{width:11px;height:11px;border-radius:50%}.count{margin-left:auto;color:var(--faint);font:10px var(--mono)}
input{width:100%;padding:7px;background:var(--ink);border:1px solid var(--rule);color:var(--paper)}.hit{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:5px;cursor:pointer}.hit:hover{background:var(--plate2);color:var(--paper)}
.canvas{position:relative;overflow:hidden}svg{width:100%;height:100%;display:block;cursor:grab}.edge{stroke:var(--rule);stroke-width:1}.edge.lit{stroke:var(--paper);stroke-width:1.5}.edge.dim{opacity:.08}.elabel{fill:var(--muted);font:9px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--ink);stroke-width:3px}
.node{cursor:pointer}.node circle{stroke:var(--ink);stroke-width:1.5}.node .halo{fill:none;stroke:var(--paper);opacity:0}.node.sel .halo{opacity:1}.node text{fill:var(--paper);font:11px var(--serif);text-anchor:middle;paint-order:stroke;stroke:var(--ink);stroke-width:3px}.node.dim{opacity:.15}
.hint{position:absolute;left:14px;bottom:10px;color:var(--faint);font:9px var(--mono);text-transform:uppercase}.zoom{position:absolute;right:12px;bottom:10px}.zoom button{background:none;border:1px solid var(--rule);color:var(--muted);width:28px;height:28px;margin-left:4px}

footer{height:36px;background:var(--plate);border-top:1px solid var(--rule);padding:9px 20px;color:var(--faint);font:10px var(--mono)}
@media(max-width:1050px){.shell{grid-template-columns:215px 1fr;height:auto}.right{grid-column:1/-1}.canvas{height:62vh}}@media(max-width:700px){.shell{grid-template-columns:1fr}.canvas{height:58vh}}

function buckets(){let b={hinge:[],hingeType:[],theme:[],concept:[],document:[]};N.forEach(n=>b[n.type].push(n));return b}
function anchors(m){let b=buckets();if(m==="atlas"){b.hingeType.forEach((n,i)=>{let a=i/b.hingeType.length*6.283;n.ax=Math.cos(a)*280;n.ay=Math.sin(a)*190;n.as=.04});b.theme.forEach((n,i)=>{let a=i/b.theme.length*6.283+.2;n.ax=Math.cos(a)*500;n.ay=Math.sin(a)*330;n.as=.03});b.concept.forEach((n,i)=>{let a=i/b.concept.length*6.283;n.ax=Math.cos(a)*720;n.ay=Math.sin(a)*470;n.as=.02});b.hinge.forEach(n=>{n.ax=0;n.ay=0;n.as=.006});b.document.forEach((n,i)=>{n.ax=900;n.ay=(i-1)*130;n.as=.06})}else{let host=m==="types"?"hingeType":m==="themes"?"theme":"concept",hs=b[host];hs.forEach((n,i)=>{let a=i/hs.length*6.283-1.57;n.ax=Math.cos(a)*570;n.ay=Math.sin(a)*380;n.as=.1});N.forEach(n=>{if(n.type===host)return;let q=[];adj[n.id].forEach(i=>{let e=E[i],o=e.source===n.id?e.target:e.source;if(by[o].type===host)q.push(by[o])});if(q.length){n.ax=q.reduce((s,x)=>s+x.ax,0)/q.length*1.08;n.ay=q.reduce((s,x)=>s+x.ay,0)/q.length*1.08;n.as=.045}else{n.ax=n.ay=0;n.as=.02}})}alpha=1}

function home(){document.getElementById("inspector").innerHTML=`<p class="kicker">How to read the atlas</p><h2 class="insp-title">Every hinge is a node</h2><p class="gloss">Worksheets connect to hinge types, IB themes and shared relations. Select a node to expose its neighbourhood.</p><p class="gloss" style="color:var(--muted)">Add new nodes and edges to <code>hinge-atlas.json</code>; the interface does not need to be rewritten.</p>`}
function select(id){sel=id;if(!id){home();draw();return}let n=by[id],rows=[];adj[id].forEach(i=>{let e=E[i],out=e.source===id,o=out?e.target:e.source;rows.push({e,out,o})});let h=`<p class="kicker" style="color:${T[n.type].colour}">${T[n.type].label}</p><h2 class="insp-title">${esc(n.label)}</h2>`;if(n.gloss)h+=`<p class="gloss">${esc(n.gloss)}</p>`;if(n.equation)h+=`<div class="eq">${esc(n.equation)}</div>`;if(n.url)h+=`<p><a class="open" href="${n.url}" target="_blank">Open document ↗</a></p>`;h+=`<p class="kicker">Relations · ${rows.length}</p>`;rows.forEach(r=>{let o=by[r.o];h+=`<button class="triple" data-go="${o.id}">${r.out?esc(n.label):esc(o.label)}<span class="pred">${esc(r.e.predicate)} →</span>${r.out?esc(o.label):esc(n.label)}</button>`});document.getElementById("inspector").innerHTML=h;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go));draw()}
